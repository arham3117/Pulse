# App CI: lint, test, build + scan, push to ECR, promote to dev (GitOps).
#
# Security notes (plan.md Phase 4.1):
# - Every action is pinned to a full commit SHA; Dependabot keeps the pins and comments fresh.
# - Workflow-level permissions are empty; each job asks only for what it needs.
# - AWS access is OIDC only (no static keys); only the `push` job can assume an AWS role.
# - The image that gets pushed is the exact tarball that Trivy scanned (no rebuild).
name: app-ci

on:
  pull_request:
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/app-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/app-ci.yml"

permissions: {}

concurrency:
  group: app-ci-${{ github.ref }}
  # Cancel superseded PR runs; on main, queue instead so a half-finished push/promote is never killed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.9"
  IMAGE_NAME: pulse
  ECR_REPOSITORY: pulse
  GITOPS_REPO: pulse-gitops
  YQ_VERSION: "v4.54.3"
  YQ_SHA256: "129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy (advisory)
        # Advisory until the codebase is fully typed; flip to blocking by removing continue-on-error.
        continue-on-error: true
        run: uv run mypy src

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway CI-only database credentials (container lives for this job only).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      elasticmq:
        image: softwaremill/elasticmq-native:1.7.1
        ports:
          - 9324:9324
    env:
      PULSE_ENV: test
      PULSE_DB_HOST: localhost
      PULSE_DB_PORT: "5432"
      PULSE_DB_NAME: pulse
      PULSE_DB_USER: postgres
      PULSE_DB_PASSWORD: postgres
      PULSE_DB_SSLMODE: disable
      PULSE_AWS_REGION: us-east-1
      PULSE_SQS_ENDPOINT_URL: http://localhost:9324
      PULSE_SQS_QUEUE_URL: http://localhost:9324/000000000000/pulse-local-checks
      # ElasticMQ ignores credentials, but botocore refuses to sign without some.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Wait for ElasticMQ
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:9324/?Action=ListQueues" >/dev/null; then
              echo "ElasticMQ is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::ElasticMQ did not become ready"; exit 1

      - name: Migrate database
        run: uv run alembic upgrade head

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f .coverage ]; then
            echo "No coverage data produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Test coverage"
            echo
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: app/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  build-scan:
    name: build-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload Trivy SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (tarball)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy scan (SARIF, all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy gate (fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

      - name: Upload scanned image for push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-tar
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0

  push:
    name: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC → pulse-ci-ecr-push
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-tar
          path: ${{ runner.temp }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_PUSH }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pulse-app-ci-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - name: Push sha tag (immutable)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          set -euo pipefail
          # Tags are immutable in ECR: a re-run of this job must not fail on an existing tag.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "$REGISTRY/$ECR_REPOSITORY:$TAG already exists; skipping push."
            exit 0
          fi
          docker load --input "$RUNNER_TEMP/image.tar"
          docker tag "$IMAGE_NAME:ci" "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          echo "Pushed \`$REGISTRY/$ECR_REPOSITORY:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  promote-dev:
    name: promote-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [push]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {} # writes go through the GitHub App token, scoped to pulse-gitops only
    concurrency:
      group: gitops-dev
      cancel-in-progress: false
    steps:
      - name: Mint GitHub App token (pulse-gitops only)
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.GITOPS_REPO }}
          permission-contents: write

      - name: Check out pulse-gitops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/${{ env.GITOPS_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          # Credentials are needed for the push below; this checkout never runs untrusted code.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Install yq (pinned, checksum-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Bump dev image tag
        working-directory: gitops
        env:
          TAG: ${{ needs.push.outputs.tag }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          file=envs/dev/values.yaml
          current="$(yq '.image.tag' "$file")"
          if [ "$current" = "$TAG" ]; then
            echo "dev already at $TAG; nothing to do."
            exit 0
          fi
          TAG="$TAG" yq -i '.image.tag = strenv(TAG)' "$file"
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "chore(dev): deploy ${TAG}" -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          # Retry on a race with another writer (e.g. promote-prod or a human commit).
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD; then
              echo "Promoted \`$TAG\` to dev (${current} → ${TAG})" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing and retrying."
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"
            sleep $((attempt * 2))
          done
          echo "::error::Could not push to pulse-gitops after 5 attempts"
          exit 1
