# Manual Terraform apply for one environment. Never runs on push (plan.md section 7: cost).
#
# plan  (pulse-ci-tf-plan, read-only): writes a plan file, shows it in the job summary,
#       uploads it as an artifact.
# apply (pulse-ci-tf-apply, GitHub Environment = the input, so prod waits for approval):
#       downloads and applies EXACTLY that plan file. Terraform refuses a stale plan if state
#       changed in between, so what you approved is what gets applied.
name: infra-apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to apply
        type: choice
        required: true
        options: [dev, prod]

permissions: {}

concurrency:
  # Two applies for the same environment never run at once (and are never cancelled midway).
  group: infra-apply-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_ENV: ${{ inputs.environment }}

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    # Only apply code that is on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC → pulse-ci-tf-plan
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TF_PLAN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pulse-infra-plan-${{ github.run_id }}
      - name: terraform init
        run: terraform init -no-color
      - name: terraform plan
        id: plan
        run: |
          set +e
          # The plan role is read-only (cannot write the S3 lockfile); the apply job takes the lock.
          terraform plan -no-color -lock=false -detailed-exitcode \
            -var-file="$TF_ENV.tfvars" -out=tfplan
          code=$?
          set -e
          case "$code" in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::terraform plan failed"; exit "$code" ;;
          esac
          terraform show -no-color tfplan > plan.txt
          {
            echo "## Terraform plan: $TF_ENV"
            echo
            grep -E '^(Plan:|No changes\.)' plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            head -c 900000 plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload plan file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.environment }}
          path: |
            infra/envs/${{ inputs.environment }}/tfplan
            infra/envs/${{ inputs.environment }}/plan.txt
          retention-days: 3
          if-no-files-found: error

  apply:
    name: apply (${{ inputs.environment }})
    needs: [plan]
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # OIDC → pulse-ci-tf-apply
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    steps:
      # Same run → same commit as the plan job, so the configuration matches the plan file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/envs/${{ inputs.environment }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TF_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: pulse-infra-apply-${{ github.run_id }}
      - name: terraform init
        run: terraform init -no-color
      - name: terraform apply (saved plan only)
        run: terraform apply -no-color -input=false tfplan
