[project]
name = "pulse"
version = "0.1.0"
description = "Pulse: uptime monitoring service (API, scheduler, worker, chaos target, maintenance)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httptools>=0.9.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0",
]

[project.scripts]
pulse-api = "pulse.api.main:run"
pulse-scheduler = "pulse.scheduler.main:run"
pulse-worker = "pulse.worker.main:run"
pulse-target = "pulse.target.main:run"
pulse-maintenance = "pulse.maintenance.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF012", "ASYNC109"]  # ASYNC109: explicit timeout args are clearer here

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
"migrations/**" = ["E501"]
"src/pulse/api/queries.py" = ["E501"]  # long SQL lines read better unwrapped

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres + ElasticMQ (docker compose up postgres elasticmq)"]
addopts = "-ra"

[tool.coverage.run]
source = ["pulse"]
branch = true
# SQLAlchemy's asyncio layer runs DB calls in greenlets; without this, coverage loses track
# of lines executed after an awaited query.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
