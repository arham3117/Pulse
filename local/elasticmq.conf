# ElasticMQ (SQS-compatible) config for the local stack. Mirrors the AWS queues:
# main queue with 60s visibility and 1h retention, DLQ after 3 receives.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats.enabled = false

queues {
  pulse-local-checks {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    messageRetentionPeriod = 1 hour
    deadLettersQueue {
      name = "pulse-local-checks-dlq"
      maxReceiveCount = 3
    }
  }
  pulse-local-checks-dlq {
    messageRetentionPeriod = 4 days
  }
}
